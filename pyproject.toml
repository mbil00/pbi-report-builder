[project]
name = "pbi-report-builder"
version = "0.9.0"
description = "CLI tool for editing Power BI PBIP project files"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pbi = "pbi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
