[project]
name = "pbi-report-builder"
dynamic = ["version"]
description = "CLI tool for editing Power BI PBIP project files"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pbi = "pbi.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Used when building outside a git checkout (e.g. a source archive without tags).
fallback_version = "0.0.0"

[tool.uv]
# Rebuild the editable install when the commit or tags change, so
# `pbi --version` follows the checkout.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/pbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
