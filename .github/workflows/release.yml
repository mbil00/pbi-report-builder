name: Release

# Runs when a version tag is pushed (the `release` skill pushes the tag and
# then creates the GitHub Release with its notes). This workflow tests the
# tagged commit, builds the wheel and sdist, checks that the built version
# matches the tag, and attaches the files to the release.
# Not published to PyPI while the project is in development.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach release files
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs needs the tags to compute the version

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Check built version matches the tag
        run: |
          expected="${TAG#v}"
          for f in dist/*; do
            case "$(basename "$f")" in
              pbi_report_builder-"$expected"-*.whl|pbi_report_builder-"$expected".tar.gz) ;;
              *) echo "::error::$f does not match tag $TAG"; exit 1 ;;
            esac
          done

      - name: Attach files to the GitHub Release
        run: |
          # The release skill creates the release right after pushing the tag.
          # Wait for it; if it never appears, create one with generated notes.
          for _ in $(seq 1 20); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 15
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
