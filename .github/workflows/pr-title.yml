name: PR title

# PRs are squash-merged as "<PR title> (#n)", so the title becomes the commit
# subject on master and drives release notes and the next version.
# Format: type(scope)!: summary  (Conventional Commits)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|chore)(\([a-z0-9._/-]+\))?!?: [^A-Z.](.*[^.])?$'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'type(scope)!: summary' with type one of feat, fix, perf, refactor, docs, test, chore; a lowercase summary; no trailing period. Got: $TITLE"
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::PR title is ${#TITLE} characters; keep it to 72 or fewer."
            exit 1
          fi
          echo "OK: $TITLE"
